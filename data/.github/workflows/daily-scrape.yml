name: Daily itch.io Group 8 collection

on:
  # Runs every day at 06:30 UTC (09:30 in Uganda, UTC+3).
  # GitHub Actions cron is not guaranteed to start at the exact minute.
  schedule:
    - cron: "30 6 * * *"
  # Allows a student to test or run a collection manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required packages
        run: pip install requests beautifulsoup4

      - name: Add the student's contact email to the User-Agent
        # Create a repository Actions variable named STUDENT_EMAIL before enabling schedule.
        env:
          STUDENT_EMAIL: ${{ vars.STUDENT_EMAIL }}
        run: |
          if [ -z "$STUDENT_EMAIL" ]; then
            echo "Set repository variable STUDENT_EMAIL to your course contact email first."
            exit 1
          fi
          sed -i "s/replace-with-your-student-email@example.com/$STUDENT_EMAIL/g" scraper.py

      - name: Run scraper
        run: python scraper.py

      - name: Commit daily raw data, cleaned data, database, and logs
        # This preserves daily observations between separate GitHub-hosted runners.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/cleaned data/group8_itchio.sqlite logs/scraper.log
          if ! git diff --cached --quiet; then
            git commit -m "Daily Group 8 itch.io scrape $(date -u +%F)"
            git push
          else
            echo "No output changes to commit."
          fi
